[package]
name = "solid_euclid"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
glam = "0.30"
hex = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
sha2 = "0.10"
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = "1.0"
