[package]
name = "solid_euclid"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
earcutr = "0.5"
glam = { version = "0.30", features = ["serde"] }
hex = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
sha2 = "0.11"
wasm-bindgen = "0.2"
