<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Platonic Solid - SolidEuclid</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico?v=2" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
      }
      #menu {
        position: absolute;
        top: 16px;
        right: 16px;
        background: rgba(0, 0, 0, 0.7);
        padding: 12px 16px;
        border-radius: 8px;
        color: white;
        font-family: sans-serif;
        font-size: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #menu label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      #menu select {
        padding: 4px 8px;
        border-radius: 4px;
        border: none;
        background: #333;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="menu">
      <label>
        Solid:
        <select id="solidType">
          <option value="Tetrahedron">Tetrahedron</option>
          <option value="Hexahedron">Hexahedron (Cube)</option>
          <option value="Octahedron">Octahedron</option>
          <option value="Dodecahedron">Dodecahedron</option>
          <option value="Icosahedron" selected>Icosahedron</option>
        </select>
      </label>
      <label>
        View Mode:
        <select id="viewMode">
          <option value="geometry" selected>Geometry</option>
          <option value="wireframe">Wireframe</option>
          <option value="solid">Solid</option>
        </select>
      </label>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
