<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sphere - SolidEuclid</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico?v=2" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
      }
      #menu {
        position: absolute;
        top: 16px;
        right: 16px;
        background: rgba(0, 0, 0, 0.7);
        padding: 12px 16px;
        border-radius: 8px;
        color: white;
        font-family: sans-serif;
        font-size: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #menu label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      #menu select,
      #menu input {
        padding: 4px 8px;
        border-radius: 4px;
        border: none;
        background: #333;
        color: white;
        cursor: pointer;
      }
      #menu input[type='number'] {
        width: 60px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="menu">
      <label>
        Type:
        <select id="sphereType">
          <option value="Slices">UV Sphere (Slices)</option>
          <option value="Cube" selected>Cube Sphere</option>
        </select>
      </label>
      <label id="slicesLabel">
        Slices:
        <input type="number" id="slices" value="8" min="3" max="64" />
      </label>
      <label>
        Segments:
        <input type="number" id="segments" value="16" min="3" max="64" />
      </label>
      <label>
        View Mode:
        <select id="viewMode">
          <option value="geometry" selected>Geometry</option>
          <option value="wireframe">Wireframe</option>
          <option value="solid">Solid</option>
        </select>
      </label>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
